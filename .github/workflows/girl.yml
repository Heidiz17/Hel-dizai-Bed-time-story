name: Generate P-Girl

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install edge-tts pydub

      - name: Run Auto Mix Girl
        run: python auto_mix.py girl

      - name: Upload Audio Artifact
        uses: actions/upload-artifact@v4.4.3
        with:
          name: Pgirl_Output
          path: "genesis_ch1_Pgirl.mp3"
